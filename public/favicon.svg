<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo brutalista negro obsidiana con borde rojo sangre -->
  <rect width="64" height="64" rx="8" fill="#050505" />
  <rect x="2" y="2" width="60" height="60" rx="6" fill="none" stroke="#8A0303" stroke-width="2" />

  <!-- Camión blindado / Geometría angular -->
  <g transform="translate(6, 12)">
    <!-- Carrocería negra con acento rojo -->
    <polygon points="2,26 8,10 32,10 42,18 50,18 52,26" fill="#121212" stroke="#8A0303" stroke-width="1.5" stroke-linejoin="miter" />
    
    <!-- Cabina / Parabrisas -->
    <polygon points="38,18 32,12 24,12 28,18" fill="#000000" stroke="#FF0033" stroke-width="1" />
    
    <!-- Ranura lateral estética Opium -->
    <line x1="6" y1="20" x2="30" y2="20" stroke="#8A0303" stroke-width="2" />
    
    <!-- Foco delantero cortante (Rojo Neón) -->
    <polygon points="48,20 52,20 50,23 46,23" fill="#FF0033" filter="url(#glow)" />

    <!-- Rueda trasera -->
    <circle cx="14" cy="27" r="5" fill="#050505" stroke="#8A0303" stroke-width="1.5" />
    <circle cx="14" cy="27" r="2" fill="#FF0033" />

    <!-- Rueda delantera -->
    <circle cx="40" cy="27" r="5" fill="#050505" stroke="#8A0303" stroke-width="1.5" />
    <circle cx="40" cy="27" r="2" fill="#FF0033" />
  </g>
</svg>
